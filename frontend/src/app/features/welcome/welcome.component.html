<div class="welcome-page">
  @if (isVerifying()) {
    <div class="welcome-card">
      <span class="spinner" aria-hidden="true"></span>
      <p>Verificando sesión...</p>
    </div>
  } @else if (currentUser()) {
    <div class="welcome-card">
      <div class="welcome-card__logo-ring">
        <img src="images/logo.png" alt="Logo de NovaStack" class="welcome-card__logo" />
      </div>
      <h1>Bienvenido</h1>
      <p class="welcome-card__message">Has iniciado sesión correctamente.</p>
      <button type="button" class="logout-button" (click)="logout()">Cerrar sesión</button>
    </div>
  }
</div>
