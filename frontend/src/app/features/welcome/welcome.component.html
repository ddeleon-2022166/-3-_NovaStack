<div class="welcome-page">
  @if (isVerifying()) {
    <div class="welcome-card">
      <span class="spinner" aria-hidden="true"></span>
      <p>Verificando sesion...</p>
    </div>
  } @else if (!verificationFailed()) {
    <div class="welcome-card">
      <img src="images/logo.png" alt="Logo de Control de Gastos" class="welcome-card__logo" />
      <h1>Bienvenido</h1>
      <p class="welcome-card__message">Has iniciado sesion correctamente.</p>
      <button type="button" class="logout-button" (click)="logout()">Cerrar sesion</button>
    </div>
  }
</div>
